<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>__TITRE_FICHIER__</title>
<style>
  @font-face{font-family:"Newsreader";src:url("__F_NR400__");font-weight:400;font-style:normal}
  @font-face{font-family:"Newsreader";src:url("__F_NR600__");font-weight:600;font-style:normal}
  @font-face{font-family:"Newsreader";src:url("__F_NRI400__");font-weight:400;font-style:italic}
  @font-face{font-family:"Hanken Grotesk";src:url("__F_HG400__");font-weight:400;font-style:normal}
  @font-face{font-family:"Hanken Grotesk";src:url("__F_HG600__");font-weight:600;font-style:normal}
  @font-face{font-family:"Hanken Grotesk";src:url("__F_HG700__");font-weight:700;font-style:normal}

  :root{
    --creme:#F7F4EF;
    --marine:#142A33;
    --cyan:#0CA6DF;
    --orange:#EC7735;
    --ardoise:#5C6A6E;
    --beige:#E3DCD2;
    --taupe:#9A8E7F;
    --blanc:#FFFFFF;
    --serif:"Newsreader",Georgia,serif;
    --sans:"Hanken Grotesk",Calibri,Arial,sans-serif;
  }

  /* A2 portrait, 3 mm de fond perdu, traits de coupe et de repérage */
  @page{
    size:420mm 594mm;
    margin:0;
    bleed:__BLEED__;
    marks:__MARKS__;
    background:var(--creme);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--creme)}
  body{font-family:var(--sans);color:var(--marine);-webkit-font-smoothing:antialiased}

  .affiche{width:420mm;height:594mm;margin:__BLEED__;position:relative;overflow:visible;background:var(--creme)}

  /* ---- Visuel, débordant dans le fond perdu ---- */
  .visuel{position:absolute;top:-9mm;left:-9mm;width:438mm;height:__H_VISUEL__;overflow:hidden}
  .visuel img{width:100%;height:100%;object-fit:cover;object-position:__CADRAGE__;display:block}
  /* voile marine dégradé : lisibilité du titre en réserve blanche */
  .voile{
    position:absolute;left:0;right:0;bottom:0;height:62%;
    background:linear-gradient(to bottom, rgba(20,42,51,0) 0%, rgba(20,42,51,.30) 34%, rgba(20,42,51,.74) 70%, rgba(20,42,51,.92) 100%);
  }

  /* ---- Titre ---- */
  .titre{
    position:absolute;left:30mm;right:30mm;bottom:__BAS_TITRE__;
    font-family:var(--serif);font-weight:400;
    font-size:__T_TITRE__;line-height:1.06;letter-spacing:-.015em;
    color:var(--blanc);margin:0;
  }
  .titre em{font-style:italic;color:var(--cyan)}

  /* ---- Bandeau crème ---- */
  .bandeau{
    position:absolute;left:-9mm;right:-9mm;bottom:-9mm;height:__H_BANDEAU__;
    background:var(--creme);
    padding:__PAD_BANDEAU__ 39mm 35mm;
  }
  .accroche{
    font-family:var(--sans);font-weight:700;
    font-size:__T_ACCROCHE__;line-height:1.18;letter-spacing:-.01em;
    color:var(--marine);margin:0;
  }
  .accroche em{font-style:normal;color:var(--marine)}
  .info{
    font-family:var(--sans);font-size:15pt;line-height:1.45;color:var(--ardoise);
    margin:9mm 0 0;
  }

  /* ---- Verrouillage logos ---- */
  .pied{position:absolute;left:39mm;right:39mm;bottom:35mm;padding-top:9mm;border-top:.75pt solid var(--beige);display:flex;align-items:flex-end;gap:18mm}
  .pied .gauche{display:flex;align-items:center;gap:14mm;min-height:26mm}
  .logo-client{height:26mm;width:auto;max-width:86mm;display:block;object-fit:contain}
  .sep-client{width:.75pt;height:24mm;background:var(--beige);flex:none}
  .marque{display:flex;align-items:center;gap:7mm}
  .marque img{height:26mm;width:auto;display:block}
  .marque .mot{font-family:var(--sans);font-weight:700;font-size:30pt;letter-spacing:-.01em;line-height:1}
  .marque .mot .a{color:var(--cyan)}
  .marque .mot .d{color:var(--orange)}
  .baseline{
    margin-left:auto;text-align:right;
    font-family:var(--serif);font-style:italic;font-size:22pt;color:var(--ardoise);line-height:1.3;
  }
  .baseline span{display:block;font-family:var(--sans);font-style:normal;font-size:13pt;color:var(--ardoise);margin-top:2.5mm}

  /* Mode aperçu : matérialise l'emplacement du logo client */
  .apercu .logo-client-vide{
    display:inline-block;height:26mm;width:74mm;
    border:.75pt dashed var(--taupe);border-radius:2mm;
    font-size:11pt;font-style:italic;color:var(--taupe);
    text-align:center;line-height:26mm;
  }
</style>
</head>
<body>
<div class="affiche">

  <div class="visuel">
    <img src="__PHOTO__" alt="">
    <div class="voile"></div>
  </div>

  <h1 class="titre">__TITRE__</h1>

  <div class="bandeau">
    <p class="accroche">__ACCROCHE__</p>
    <p class="info">__INFO__</p>

    <div class="pied">
      <div class="gauche">
        <img class="logo-client" data-slot="logo-client" src="__LOGO_CLIENT__" alt="">
        <span class="sep-client" data-slot="logo-client"></span>
        <div class="marque">
          <img src="__LOGO__" alt="">
          <span class="mot"><span class="a">Avis</span><span class="d">Doc</span></span>
        </div>
      </div>
      <div class="baseline">
        La dermatologie n'attend pas.
        <span>avisdoc.fr</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
